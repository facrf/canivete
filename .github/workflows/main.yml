name: Build Canivete da Mata

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: Tests, vet and vulnerability scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Verify modules and formatting
      run: |
        go mod verify
        test -z "$(gofmt -l .)"

    - name: Run tests with race detector
      run: go test -race ./...

    - name: Run go vet
      run: go vet ./...

    - name: Scan known vulnerabilities
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  build:
    name: Build Go Binary
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        include:
          - goarch: amd64
            goos: linux
          - goarch: arm
            goos: linux
            goarm: 7
          - goarch: arm64
            goos: linux
          - goarch: riscv64
            goos: linux

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Download Go modules
      run: go mod download

    - name: Build Binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CGO_ENABLED: 0
      run: |
        OUTPUT_NAME=canivete-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goarch }}" = "arm" ]; then
          OUTPUT_NAME=${OUTPUT_NAME}v${{ matrix.goarm }}
        fi
        go build -ldflags="-w -s" -o $OUTPUT_NAME .
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: canivete-${{ matrix.goos }}-${{ matrix.goarch }}
        path: canivete-*
