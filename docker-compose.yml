# ============================================================
# Canivete da Mata — Stack para Portainer
# ============================================================
# Como usar no Portainer:
#   1. Stacks > Add Stack > Web editor
#   2. Cole este conteúdo
#   3. Ajuste a variável IMAGE abaixo se necessário
#   4. Clique em "Deploy the stack"
#
# Para usar a imagem local (build no host):
#   Altere a linha "image:" para: image: canivete-da-mata:latest
#   E adicione o bloco "build:" abaixo.
# ============================================================

services:
  canivete:
    # Imagem pré-compilada do GitHub Container Registry (multi-arch)
    # Suporta: linux/amd64, linux/arm64, linux/arm/v7, linux/riscv64
    image: ghcr.io/facrf/canivete:latest

    container_name: canivete-da-mata

    restart: unless-stopped

    ports:
      - "7001:7001"

    environment:
      - TZ=America/Sao_Paulo

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=512M,mode=1777

    # Limites de recursos recomendados (opcional)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 64M

    # Health check para reinicialização automática em caso de falha
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Labels para integração com Traefik (descomente se usar Traefik como proxy)
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.canivete.rule=Host(`canivete.seu-dominio.com`)"
    #   - "traefik.http.routers.canivete.entrypoints=websecure"
    #   - "traefik.http.routers.canivete.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.canivete.loadbalancer.server.port=7001"

    # Rede opcional (remova se não usar uma rede externa)
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
